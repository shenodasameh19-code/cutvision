<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CutVision Pro</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#0b0f14;
color:white;
display:flex;
height:100vh;
overflow:hidden;
}

/* Sidebar */

.sidebar{
width:250px;
background:#111827;
padding:30px 20px;
display:flex;
flex-direction:column;
justify-content:space-between;
border-right:1px solid #222;
}

.logo{
font-size:30px;
font-weight:bold;
color:cyan;
text-shadow:0 0 15px cyan;
margin-bottom:50px;
}

.menu{
display:flex;
flex-direction:column;
gap:20px;
}

.menu button{
background:#1f2937;
border:none;
padding:15px;
border-radius:12px;
color:white;
font-size:16px;
cursor:pointer;
transition:0.3s;
}

.menu button:hover{
background:cyan;
color:black;
transform:translateX(5px);
}

.logout{
background:red;
border:none;
padding:15px;
border-radius:12px;
color:white;
cursor:pointer;
}

/* Main */

.main{
flex:1;
padding:30px;
overflow-y:auto;
}

/* Top */

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:30px;
}

.search{
background:#1f2937;
padding:12px 20px;
border-radius:12px;
width:300px;
color:white;
border:none;
}

.profile{
background:#1f2937;
padding:12px 20px;
border-radius:12px;
}

/* Hero */

.hero{
background:linear-gradient(135deg,#00f5ff,#0066ff);
padding:40px;
border-radius:25px;
margin-bottom:30px;
box-shadow:0 0 25px cyan;
}

.hero h1{
font-size:45px;
margin-bottom:15px;
}

.hero p{
max-width:600px;
line-height:1.7;
}

/* Upload */

.upload{
background:#111827;
padding:30px;
border-radius:25px;
margin-bottom:30px;
}

.upload h2{
margin-bottom:20px;
color:cyan;
}

#preview{
width:250px;
height:250px;
object-fit:cover;
border-radius:20px;
border:3px solid cyan;
margin-top:20px;
display:none;
}

/* Cards */

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:25px;
}

.card{
background:#111827;
border-radius:20px;
overflow:hidden;
transition:0.3s;
}

.card:hover{
transform:translateY(-10px);
box-shadow:0 0 25px cyan;
}

.card img{
width:100%;
height:250px;
object-fit:cover;
}

.card h3{
padding:15px;
color:cyan;
}

.card button{
margin:15px;
width:calc(100% - 30px);
padding:12px;
border:none;
border-radius:10px;
background:cyan;
font-size:18px;
cursor:pointer;
}

/* Selected Style */

.selected{
background:#111827;
padding:30px;
border-radius:25px;
margin-top:30px;
font-size:25px;
color:#00ff88;
text-align:center;
}

</style>

</head>

<body>

<!-- Sidebar -->

<div class="sidebar">

<div>

<div class="logo">
CutVision
</div>

<div class="menu">

<button>🏠 Dashboard</button>
<button>✂️ Hairstyles</button>
<button>📸 AI Preview</button>
<button>📅 Booking</button>
<button>⚙️ Settings</button>

</div>

</div>

<button class="logout">
Logout
</button>

</div>

<!-- Main -->

<div class="main">

<!-- Topbar -->

<div class="topbar">

<input class="search" placeholder="Search hairstyle...">

<div class="profile">
😎 Shenoda
</div>

</div>

<!-- Hero -->

<div class="hero">

<h1>Future Of Haircuts 🔥</h1>

<p>
Upload your photo and explore futuristic AI hairstyle experiences before cutting your hair.
</p>

</div>

<!-- Upload -->

<div class="upload">

<h2>Upload Your Photo</h2>

<input type="file" id="upload">

<br>

<img id="preview">

</div>

<!-- Cards -->

<div class="cards">

<div class="card">

<img src="https://images.unsplash.com/photo-1517832606299-7ae9b720a186?q=80&w=800">

<h3>Fade Cut</h3>

<button onclick="chooseStyle('Fade Cut')">
Choose
</button>

</div>

<div class="card">

<img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?q=80&w=800">

<h3>Buzz Cut</h3>

<button onclick="chooseStyle('Buzz Cut')">
Choose
</button>

</div>

<div class="card">

<img src="https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?q=80&w=800">

<h3>Curly Style</h3>

<button onclick="chooseStyle('Curly Style')">
Choose
</button>

</div>

</div>

<!-- Selected -->

<div class="selected" id="selectedStyle">

🔥 No Style Selected Yet

</div>

</div>

<script>

/* Upload */

const upload = document.getElementById("upload");
const preview = document.getElementById("preview");

upload.addEventListener("change", function(){

const file = this.files[0];

if(file){

preview.style.display = "block";
preview.src = URL.createObjectURL(file);

}

});

/* Style Selection */

function chooseStyle(style){

document.getElementById("selectedStyle").innerHTML =
"🔥 Selected Style: " + style;

}

</script>

</body>

</html>
